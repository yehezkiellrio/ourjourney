<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Abigail Only ♡</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#211c1a;color:#f7f2ea;font-family:system-ui,-apple-system,sans-serif;padding:24px}.card{text-align:center;max-width:760px}.mini{font-size:10px;letter-spacing:.24em;color:#c6a66b}.card h1{font:400 clamp(48px,9vw,92px)/.95 Georgia,serif;margin:20px 0 42px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answers button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#f7f2ea;padding:16px;border-radius:999px;cursor:pointer}.answers button:hover{background:#f7f2ea;color:#211c1a}.result{font:italic 24px Georgia,serif;color:#d9b6b0;min-height:42px;margin-top:35px}.back{display:inline-block;margin-top:30px;color:#c6a66b;font-size:12px}@media(max-width:560px){.answers{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <p class="mini">TOP SECRET — ABIGAIL ONLY</p>
    <h1>Who is the prettiest girl in my world?</h1>
    <div class="answers">
      <button>Abigail</button><button>Abigail</button><button>Abigail</button><button>obviously Abigail</button>
    </div>
    <p class="result" id="result"></p>
    <a class="back" href="index.html">← back to our story</a>
  </main>
  <script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.getElementById('result').textContent='correct answer, sayang. ♡');</script>
</body>
</html>
